# AREDN Services Map - copy to config.yaml and edit.

listen: 0.0.0.0
port: 8088
data_dir: ./data            # caches, so a restart shows the last results at once

# An AREDN node whose sysinfo lists the whole mesh's hosts and services.
# A supernode's /a/sysinfo does; a regular node may list only what's near it
# (try it: the "hosts" list should be in the thousands on a big mesh).
node_url: http://localnode.local.mesh/cgi-bin/sysinfo.json

# Your MeshPhone office name (as in the directory), if this box is its PBX.
# Leave empty otherwise; the map then shows "measured from this station".
own_office: ""

# Mesh DNS for *.local.mesh names: "auto" finds it in the DHCP lease, or set
# your node's address, e.g. 10.1.2.3.
dns_server: auto

# Name each node's place ("Salem, Oregon") with OpenStreetMap Nominatim,
# at most one request a second, cached. Needs internet; off = grid squares only.
geocode: true

# Serve only to mesh / LAN addresses (recommended: the MeshPhone white pages
# hold other operators' names and contact details, published for the mesh).
allow_internet: false

meshphone:
  enabled: true
  map_refresh_hours: 24
  # offices_url: http://wt0f-meshphone.local.mesh/api/network_json
  # whitepages_urls:
  #   - http://WT0F-freepbx.local.mesh/whitepages.xml
  # trunk_reports_url: http://wt0f-meshphone.local.mesh/network_map.html

services:
  enabled: true
  refresh_hours: 24         # every service gets one request per refresh (at least 6 h)

# The name other copies of this map see on results you share (e.g. your node
# or callsign-based name). It's pinned to this copy's key by the others, so
# keep it unique. Empty = the name of the node in node_url plus a short key
# fingerprint (e.g. "n0call-hap/3fa9c1").
station: ""

# Sharing with other copies of this map on the mesh. Services are checked a
# quarter of the mesh at a time (one quarter every refresh_hours / 4); a
# quarter another copy checked within max_age_hours is taken from it after it
# passes the checks in the README ("Sharing and regions"). Other copies are
# found by their advertised service: on your node, advertise this map as a
# service named "AREDN Services Map". Add any others here by URL.
sharing:
  enabled: true
  max_age_hours: 4
  peers: []
  #  - http://10.1.2.3:8088

# Updates from GitHub releases: a daily check (needs internet), shown on the
# page. auto_install: true installs a newer release and restarts by itself;
# otherwise run "aredn-services-map --update" and restart the service.
updates:
  check: true
  auto_install: false

# Map tiles. The page gets its tiles from this box, which serves each one from
# an offline tile file (mbtiles), its own cache, the internet (url), or another
# copy of this map on the mesh, in that order; so a box without internet still
# shows a map when any box on the mesh has the area. OpenStreetMap's servers are
# run by volunteers: tiles are fetched only as people view them and cached; for
# heavier use set url to your own / a commercial tile server or use an mbtiles file.
tiles:
  url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
  mbtiles: ""               # e.g. /opt/maps/maine.mbtiles
  internet: true            # false: never fetch tiles from the internet
  share: true               # answer other copies' tile requests (file and cache only)
  cache_mb: 1000
  cache_days: 30            # older tiles are refreshed when online, still served when not
  max_zoom: 19
